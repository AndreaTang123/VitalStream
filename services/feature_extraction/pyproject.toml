[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitalstream-feature-extraction"
version = "0.1.0"
description = "Layer 1 — NumPy/SciPy feature extraction, gray-release aware (PRD 3.1)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "aiokafka>=0.11",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.3",
    "vitalstream-common",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.uv.sources]
vitalstream-common = { path = "../../libs/common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/feature_extraction"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
