[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitalstream-api"
version = "0.1.0"
description = "Layer 3 — FastAPI backend: OAuth2/JWT auth, RBAC, audit log (PRD 3.3)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "vitalstream-common",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "ruff>=0.5"]

[tool.uv.sources]
vitalstream-common = { path = "../../libs/common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
