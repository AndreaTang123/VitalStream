[alembic]
# %(here)s resolves relative to this ini file's own directory, not the
# process's cwd — without it, `alembic -c services/api/alembic.ini ...` run
# from the repo root (as the README's commands do) fails with "Path doesn't
# exist: migrations", because plain `migrations` was being resolved against
# cwd instead of against services/api/.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
version_path_separator = os

# sqlalchemy.url is intentionally omitted — migrations/env.py builds it from
# api.settings.settings.postgres_dsn (same source of truth as the app),
# swapping the asyncpg driver for psycopg2 since Alembic runs synchronously.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
