[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitalstream-device-simulator"
version = "0.1.0"
description = "Simulated wearable device: replays real dataset recordings against the ingestion API (PRD 1.3 / week1-2-layer1-guide.md Step 3)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "vitalstream-common",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.uv.sources]
vitalstream-common = { path = "../../libs/common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/device_simulator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
