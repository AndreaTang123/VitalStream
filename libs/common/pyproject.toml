[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitalstream-common"
version = "0.1.0"
description = "Shared schemas and telemetry helpers for VitalStream services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/vitalstream_common"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
