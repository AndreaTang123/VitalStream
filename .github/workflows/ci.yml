name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - libs/common
          - services/ingestion
          - services/feature_extraction
          - services/config_service
          - services/insight_service
          - services/api
    env:
      # week8: CI must never depend on OpenAI (no key available to forked
      # PRs, and it shouldn't cost money either way) — see
      # insight_service/llm_client.py.
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared common lib
        run: pip install -e libs/common
      - name: Install service
        working-directory: ${{ matrix.service }}
        run: |
          pip install -e ".[dev]"
      - name: Lint
        working-directory: ${{ matrix.service }}
        run: ruff check src
      - name: Test
        working-directory: ${{ matrix.service }}
        run: pytest tests -q
      # Coverage is only meaningfully tracked for api (the service the
      # week6/7/8 permission-matrix/audit/route-sweep tests actually live
      # in) — see benchmarks/RESULTS.md §7 for the number this produces.
      - name: Test with coverage (api only)
        if: matrix.service == 'services/api'
        working-directory: services/api
        run: pytest tests -q --cov=api --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: matrix.service == 'services/api'
        with: { name: api-coverage, path: services/api/coverage.xml }

  # week8 Step 7: the exact bug class this catches (alembic path resolution,
  # StrEnum-vs-Postgres-enum value mismatch, asyncpg type inference on raw
  # SQL, `window` being a reserved word) is invisible to the sqlite-backed
  # unit tests above — every one of those was found by hand this week
  # running against a real Postgres, which is precisely why this job exists
  # instead of trusting the unit-test matrix alone.
  db-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitalstream
          POSTGRES_PASSWORD: vitalstream
          POSTGRES_DB: vitalstream
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitalstream" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e libs/common
      - run: pip install -e "services/api[dev]"
      - name: alembic upgrade head against a real, empty Postgres
        run: alembic -c services/api/alembic.ini upgrade head
      - name: alembic current shows the head revision
        run: alembic -c services/api/alembic.ini current | grep -q "(head)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run build

  # week8: the full stack, for real — docker compose up, migrate, seed,
  # then the 4 Playwright specs that encode this project's three
  # acceptance-demo claims (patient sees real data + generates an insight;
  # coach authorized/denied correctly; operator's rollback is audited).
  # LLM_MODE=mock (docker-compose.loadtest.yml) so this costs nothing and
  # doesn't depend on OpenAI being reachable from a GitHub-hosted runner.
  e2e:
    needs: [python-services, frontend]
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: pip install -e libs/common
      - run: pip install -e "services/api[dev]"
      - name: Build and start the full stack
        run: >
          docker compose -f docker-compose.yml -f docker-compose.loadtest.yml
          up -d --build --wait --wait-timeout 300
      - name: Migrate + seed demo accounts
        run: |
          alembic -c services/api/alembic.ini upgrade head
          python -m scripts.seed
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
      - if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            compose-logs.txt
            frontend/playwright-report
