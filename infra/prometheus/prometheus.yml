# TODO: none of the services expose a /metrics endpoint yet (PRD week 8 —
# "打磨" — is where Prometheus instrumentation gets added). These targets are
# where they'll live once prometheus-fastapi-instrumentator or similar is wired in.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ingestion
    static_configs:
      - targets: ["host.docker.internal:8001"]
  - job_name: config_service
    static_configs:
      - targets: ["host.docker.internal:8002"]
  - job_name: insight_service
    static_configs:
      - targets: ["host.docker.internal:8003"]
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:8000"]
