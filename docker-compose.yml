name: vitalstream

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Kafka-protocol broker for raw-signals/features (week1-2-layer1-guide.md
  # decision: Redpanda over Kafka+ZooKeeper — one container, same wire
  # protocol, so aiokafka clients don't know or care. Swap to a real Kafka
  # broker later if needed; nothing downstream is coupled to Redpanda itself.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,PLAINTEXT_HOST://localhost:29092
    ports: ["29092:29092", "9644:9644"]
    volumes: ["redpanda_data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: vitalstream
      POSTGRES_PASSWORD: vitalstream
      POSTGRES_DB: vitalstream
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vitalstream"]
      interval: 5s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: vitalstream
      POSTGRES_PASSWORD: vitalstream
      POSTGRES_DB: vitalstream_timeseries
    volumes: ["timescale_data:/var/lib/postgresql/data"]

  # Local trace viewer (week3-layer1-deepening-guide.md Step 5) — Jaeger's
  # all-in-one image, not Tempo/Grafana Cloud, so there's no extra account
  # setup this week. OTLP receiver matches .env.example's
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:latest
    # --web.enable-remote-write-receiver: lets `k6 run -o
    # experimental-prometheus-rw` push its own client-side metrics into the
    # same Prometheus instance, so a load test's request-generator view and
    # the system's own server-side view sit in the same Grafana dashboard.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anonymous read-only access (week8 Step 2) — a demo recording or a
      # quick "look at the dashboard" doesn't need a login prompt first.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      # One mount, not two nested ones (the dashboard JSON lives under
      # provisioning/dashboards/files/ precisely so it can) — Docker can't
      # create a mountpoint inside an already-read-only bind mount.
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  # Application services build from local Dockerfiles. Each builds with the
  # repo root as context so it can COPY libs/common. ingestion's Dockerfile
  # entrypoint (services/ingestion/Dockerfile) still needs `--loop uvloop`
  # wired in if you want that benchmark's exact numbers reproduced in a
  # container — see README's benchmarking section.
  #
  # `env_file: .env` supplies everything that's the same in-container as on
  # the host (JWT_SECRET_KEY, SERVICE_TOKEN, OPENAI_API_KEY, ...); the
  # `environment:` block below each service OVERRIDES the handful of
  # inter-service URLs that .env sets to `localhost:<port>` for host-based
  # dev (`make bootstrap` + running each service's venv directly) — inside
  # the compose network, "localhost" means the container itself, not its
  # neighbor, so those have to become the other service's compose name.
  ingestion:
    build: { context: ., dockerfile: services/ingestion/Dockerfile }
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Same shared SQLAlchemy-style DSN as every other service — ingestion
      # connects with raw asyncpg internally (device_registry.py), which
      # doesn't understand the `+asyncpg` driver suffix on its own, so that
      # module normalizes it rather than needing a special-cased DSN here.
      POSTGRES_DSN: postgresql+asyncpg://vitalstream:vitalstream@postgres:5432/vitalstream
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["8001:8001"]
    depends_on:
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
      jaeger: { condition: service_started }
    healthcheck: &http_healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      retries: 15
      start_period: 10s

  feature_extraction:
    build: { context: ., dockerfile: services/feature_extraction/Dockerfile }
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_DSN: postgresql+asyncpg://vitalstream:vitalstream@postgres:5432/vitalstream
      CONFIG_SERVICE_BASE_URL: http://config_service:8002
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # week8 Step 5: SYS_PTRACE so `docker exec ... py-spy record` can attach
    # to the consumer loop's PID 1 for a flame graph if load testing finds
    # this service is the bottleneck (it's the CPU-bound one — bandpass
    # filter + peak detection per window, not I/O). Denied by Docker's
    # default seccomp/capability set otherwise, even for same-container
    # introspection.
    cap_add: [SYS_PTRACE]
    ports: ["9101:9101"]
    depends_on:
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
      jaeger: { condition: service_started }
    # No HTTP app (Kafka consumer loop) — the metrics server (week8 Step 1)
    # doubles as the healthcheck endpoint; any response means the process
    # got far enough to call start_http_server(), which only happens after
    # the Kafka consumer/producer/Postgres store all started successfully.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9101/')"]
      interval: 5s
      retries: 15
      start_period: 10s

  config_service:
    build: { context: ., dockerfile: services/config_service/Dockerfile }
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://vitalstream:vitalstream@postgres:5432/vitalstream
    ports: ["8002:8002"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *http_healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/healthz')"]

  # insight_service ships two distinct entrypoints (see its Dockerfile /
  # README "Insights pipeline"): `.main`, the RBAC-gated on-demand HTTP
  # endpoint api's insights.generate calls, and `.consumer`, the autonomous
  # Kafka consumer that turns feature_extraction's throttled
  # features-extracted stream into `device_insights` rows — the data the
  # frontend dashboard's trend/history views actually show. Both need to be
  # running; the Dockerfile's own CMD only starts `.main`, so the consumer
  # gets its own compose service on the same image with `command:` override.
  insight_service:
    build: { context: ., dockerfile: services/insight_service/Dockerfile }
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_DSN: postgresql+asyncpg://vitalstream:vitalstream@postgres:5432/vitalstream
      REDIS_URL: redis://redis:6379/0
    ports: ["8003:8003"]
    depends_on:
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *http_healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8003/healthz')"]

  insight_service_consumer:
    build: { context: ., dockerfile: services/insight_service/Dockerfile }
    command: ["python", "-m", "insight_service.consumer"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_DSN: postgresql+asyncpg://vitalstream:vitalstream@postgres:5432/vitalstream
      REDIS_URL: redis://redis:6379/0
    ports: ["9102:9102"]
    depends_on:
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9102/')"]
      interval: 5s
      retries: 15
      start_period: 10s

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://vitalstream:vitalstream@postgres:5432/vitalstream
      INSIGHT_SERVICE_BASE_URL: http://insight_service:8003
      CONFIG_SERVICE_BASE_URL: http://config_service:8002
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      insight_service: { condition: service_healthy }
    healthcheck:
      <<: *http_healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]

  # week7 Step 10: BFF frontend — API_BASE_URL points at the api container
  # by its compose service name, not localhost:8000 (that's only correct
  # from the host machine running `npm run dev`, see frontend/.env.local).
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      retries: 15
      start_period: 10s

volumes:
  redis_data:
  redpanda_data:
  postgres_data:
  timescale_data:
  grafana_data:
