name: vitalstream

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  # Kafka-protocol broker for raw-signals/features (week1-2-layer1-guide.md
  # decision: Redpanda over Kafka+ZooKeeper — one container, same wire
  # protocol, so aiokafka clients don't know or care. Swap to a real Kafka
  # broker later if needed; nothing downstream is coupled to Redpanda itself.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,PLAINTEXT_HOST://localhost:29092
    ports: ["29092:29092", "9644:9644"]
    volumes: ["redpanda_data:/var/lib/redpanda/data"]

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: vitalstream
      POSTGRES_PASSWORD: vitalstream
      POSTGRES_DB: vitalstream
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: vitalstream
      POSTGRES_PASSWORD: vitalstream
      POSTGRES_DB: vitalstream_timeseries
    volumes: ["timescale_data:/var/lib/postgresql/data"]

  # Local trace viewer (week3-layer1-deepening-guide.md Step 5) — Jaeger's
  # all-in-one image, not Tempo/Grafana Cloud, so there's no extra account
  # setup this week. OTLP receiver matches .env.example's
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: ["grafana_data:/var/lib/grafana"]

  # Application services build from local Dockerfiles once implemented.
  # Each builds with the repo root as context so it can COPY libs/common.
  # Uncomment as each service becomes runnable.
  #
  # ingestion:
  #   build: { context: ., dockerfile: services/ingestion/Dockerfile }
  #   env_file: .env
  #   ports: ["8001:8001"]
  #   depends_on: [redpanda]
  #
  # feature_extraction:
  #   build: { context: ., dockerfile: services/feature_extraction/Dockerfile }
  #   env_file: .env
  #   depends_on: [redpanda, postgres]
  #
  # config_service:
  #   build: { context: ., dockerfile: services/config_service/Dockerfile }
  #   env_file: .env
  #   ports: ["8002:8002"]
  #   depends_on: [postgres]
  #
  # insight_service:
  #   build: { context: ., dockerfile: services/insight_service/Dockerfile }
  #   env_file: .env
  #   ports: ["8003:8003"]
  #   depends_on: [redis]
  #
  # api:
  #   build: { context: ., dockerfile: services/api/Dockerfile }
  #   env_file: .env
  #   ports: ["8000:8000"]
  #   depends_on: [postgres, insight_service]
  #
  # frontend:
  #   build: ./frontend
  #   ports: ["3000:3000"]
  #   depends_on: [api]

volumes:
  redis_data:
  redpanda_data:
  postgres_data:
  timescale_data:
  grafana_data:
